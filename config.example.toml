# AeroForge 配置模板（config.example.toml）
# 依据：规格 §18.4 / §6.5 / §1.7.3 OI-31
#
# 这是一个**模板，不是生效文件**。应用读的是 config_file() 给出的 config.toml：
#   * 源码运行  → 仓库根的 config.toml（与 data/ 同级）
#   * 安装后运行 → AEROFORGE_DATA_DIR 的父目录（默认在用户目录下）
# 要改配置有两条路：① 把本文件复制为 config.toml 后编辑；② 用界面「阈值设置」写入。
# 两条路写的是同一个文件，界面只是替你保证了"键名合法、取值合法、其余内容不动"。
#
# 来源优先级（§18.4，不得更改）：环境变量 > config.toml > 内置默认值
#   环境变量名 = 本文件的字段名大写 + AEROFORGE_ 前缀
#   （例如 twr_liquid_min → AEROFORGE_TWR_LIQUID_MIN）。
#   因此界面与诊断显示的一律是**生效值**而非"本文件里的值"：
#   若某项被环境变量压住，改本文件不会生效——界面会在该项旁标出「来源」。
#
# 未在本文件列出的顶层键会被**忽略**（不会导致应用启动失败），但也不会被读取。
# 本文件是扁平结构（顶层键，无 [table]）：写成 [table] 反而会在"文件存在但缺该段"
# 时抛 KeyError，把一个可恢复的编辑事故变成启动失败。
#
# ⚠ 来源声明（§6.5 强制）：下列阈值均为**工程惯例值，非权威来源**——
#   它们来自公开工程的量级经验，没有任何一条可以引用为标准或论文结论。
#   请勿把它们当作"规格规定的硬性真理"。
#
# ⚠ 每一项都写明了**生效边界**：改到边界之外不会"更严格/更宽松"，
#   而是直接被拒绝写入（422，config.toml 保持原样）。

# ---------------------------------------------------------------------------
# 起飞推重比下界（硬约束：不满足即拒绝该方案）
# 判据：T/W ≥ 下界。档位只看**第一级**发动机的 propellant_phase（§1.7.3 OI-30）。
# 生效边界：> 0；液体档与混合档共用本值（规格未为 hybrid 另立一档）。
# ---------------------------------------------------------------------------
twr_liquid_min = 1.2

# 起飞推重比下界（固体助推档）
# 判据：第一级 propellant_phase = "solid" 时改用本值（默认 1.5）。
# 生效边界：> 0；实际使用的档位与依据会印在诊断账目里，故这不是隐式判定。
twr_solid_min = 1.5

# ---------------------------------------------------------------------------
# 结构质量比区间（警告）——只判**一级**
# 判据：σ/(1−σ) ∈ [下界, 上界]，σ = 该级 structure_coefficient。
# 生效边界：> 0；上下界颠倒不会自动纠正，请自行保持 下界 < 上界。
# ---------------------------------------------------------------------------
structure_mass_ratio_min = 0.03
structure_mass_ratio_max = 0.08

# ---------------------------------------------------------------------------
# 长径比区间（警告）——逐级判定
# 判据：长度 / 直径 ∈ [下界, 上界]；上界过大有纵向振动风险。
# 生效边界：> 0；同样请自行保持 下界 < 上界。
# ---------------------------------------------------------------------------
length_to_diameter_min = 5.0
length_to_diameter_max = 30.0

# ---------------------------------------------------------------------------
# 贮箱最小工艺厚度（m）——**默认未配置**
# 判据：壁厚 ≥ 本值。规格 §6.5 表给了这条判据但**没给数值**（来源列写的是
#       「工艺下限」），故本项不设数值默认值：未配置 = 该条判据**不判定**，
#       并在诊断账目里如实标注「未配置」，绝不回落到某个凭空默认值。
# 生效边界：> 0（单位 m）。留空/删除本行 = 回到「未配置」。
# 量级参照（仅供理解数量级，**不是**默认值、也不是推荐值）：
#       NASA Centaur 不锈钢「气球箱」壁厚 0.51 mm = 0.00051 m（规格 §1.7.3）。
# 要启用：取消下面一行的注释，并填入你自己核过来源的工艺下限。
# min_tank_wall_thickness_m = <你的工艺下限，单位 m>
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# 级间 ΔV 分配允许偏离（警告）——判定属 M4（需 §8.5 的最优分配结果）
# 判据：各级实际 ΔV 相对最优分配的偏离 ≤ 本值（相对量，0.20 = 20%）。
# 生效边界：> 0。M2 阶段该规则登记为「未判定」，本值不影响现状。
# ---------------------------------------------------------------------------
dv_allocation_deviation_max = 0.20

# ---------------------------------------------------------------------------
# 上面级分离后 ΔV 余量区间（警告）——判定属 M4
# 判据：余量 ∈ [下界, 上界]（相对量，0.01 = 1%）。
# 生效边界：≥ 0；上界须自洽于下界。
# ---------------------------------------------------------------------------
upper_stage_margin_min = 0.01
upper_stage_margin_max = 0.05
